<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaVerse MMORPG - Game Experience</title>
    <style>
        /* Reset e stili generali */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { overflow: hidden; background-color: #000; color: white; }
        #game-container, .ui-overlay { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        .ui-overlay { pointer-events: none; z-index: 10; }
        .ui-element { pointer-events: auto; }

        /* HUD */
        .hud { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.5); border-radius:10px; padding:15px; backdrop-filter:blur(5px); border:1px solid rgba(108,99,255,0.5); box-shadow:0 0 15px rgba(108,99,255,0.3); display:flex; align-items:center; }
        .avatar { width:50px;height:50px;background:linear-gradient(45deg,#6c63ff,#38ffdd);border-radius:50%;margin-right:15px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px; }
        .player-stats { display:flex; flex-direction:column; }
        .player-name { font-size:14px; font-weight:bold; margin-bottom:5px; }
        .stats-bars { display:flex; gap:10px; }
        .stat-container { display:flex; align-items:center; gap:5px; }
        .stat-bar { width:100px;height:8px;background:rgba(255,255,255,0.2);border-radius:4px; overflow:hidden; }
        .stat-fill { height:100%; border-radius:4px; }
        .health-fill { background:linear-gradient(90deg,#ff5e62,#ff9966); width:65%; }
        .energy-fill { background:linear-gradient(90deg,#56ccf2,#2f80ed); width:80%; }

        /* Bilancio cripto */
        .crypto-balance { position:absolute; top:20px; right:20px; background:rgba(0,0,0,0.5);border-radius:10px;padding:10px 15px;backdrop-filter:blur(5px);border:1px solid rgba(108,99,255,0.5);display:flex;align-items:center;gap:8px;font-weight:bold; }
        .token-icon { width:20px;height:20px;background:linear-gradient(45deg,#6c63ff,#38ffdd);border-radius:50%; }

        /* Minimap */
        .minimap { position:absolute; bottom:20px; right:20px; width:150px;height:150px;background:rgba(0,0,0,0.5);border-radius:10px;backdrop-filter:blur(5px);border:1px solid rgba(108,99,255,0.5);overflow:hidden; }
        .minimap-content { width:100%;height:100%;background:rgba(42,42,70,0.8);position:relative; }
        .player-position { position:absolute;width:10px;height:10px;background:#6c63ff;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 5px rgba(108,99,255,0.8); }
        .landmark { position:absolute;width:6px;height:6px;background:rgba(255,255,255,0.8);border-radius:50%; }

        /* Controlli mobili/desktop */
        .controls { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:15px; }
        .control-btn { width:60px;height:60px;background:rgba(0,0,0,0.5);border-radius:50%;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px);border:1px solid rgba(108,99,255,0.5);cursor:pointer;color:white;font-size:24px;transition:all 0.3s; }
        .control-btn:hover { background:rgba(108,99,255,0.3);transform:translateY(-3px); }

        /* Inventario */
        .inventory-btn { position:absolute; right:20px; top:70px; padding:8px 15px;background:rgba(0,0,0,0.5);border-radius:10px;backdrop-filter:blur(5px);border:1px solid rgba(108,99,255,0.5);color:white;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:14px;transition:all 0.3s; }
        .inventory-btn:hover { background:rgba(108,99,255,0.3); }

        /* Loading screen */
        .loading-screen { position:fixed;top:0;left:0;width:100%;height:100%;background:#2a2a46;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;transition:opacity 1s; }
        .loading-logo { font-size:2.5rem;font-weight:700;margin-bottom:30px;background:linear-gradient(to right,#6c63ff,#38ffdd);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent; }
        .loading-bar-container { width:300px;height:15px;background:rgba(255,255,255,0.1);border-radius:10px;overflow:hidden;margin-bottom:20px; }
        .loading-bar { height:100%;width:0%;background:linear-gradient(90deg,#6c63ff,#38ffdd);border-radius:10px;transition:width 0.3s; }
        .loading-text { font-size:14px;color:rgba(255,255,255,0.7); }

        /* Wallet */
        .wallet-status { position:absolute; top:20px; left:20px; background:rgba(0,0,0,0.5);border-radius:10px;padding:8px 15px;backdrop-filter:blur(5px);border:1px solid rgba(108,99,255,0.5);display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;transition:all 0.3s; }
        .wallet-status:hover { background:rgba(108,99,255,0.3); }
        .wallet-indicator { width:10px;height:10px;background:#4ade80;border-radius:50%; }
        .wallet-address { font-family:monospace; }

        /* Chat */
        .chat-container { position:absolute; left:20px; bottom:100px; width:300px; height:200px; background:rgba(0,0,0,0.5);border-radius:10px;backdrop-filter:blur(5px);border:1px solid rgba(108,99,255,0.5);display:flex;flex-direction:column;overflow:hidden; }
        .chat-messages { flex:1; overflow-y:auto; padding:10px; }
        .message { margin-bottom:5px; font-size:12px; line-height:1.4; }
        .message-user { color:#38ffdd; font-weight:bold; }
        .message-system { color:#ff9966; font-style:italic; }
        .chat-input { display:flex; padding:5px; border-top:1px solid rgba(108,99,255,0.3); }
        .chat-input input { flex:1; background:rgba(0,0,0,0.3); border:none; border-radius:5px; padding:5px 10px; color:white; outline:none; }

        /* Notification */
        .notification { position:absolute; top:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7);border-radius:10px;padding:10px 20px;backdrop-filter:blur(5px);border:1px solid rgba(108,99,255,0.5);color:white;text-align:center;opacity:0;transition:opacity 0.3s; }
        .notification.show { opacity:1; }

        /* Mobile tweaks */
        @media (max-width: 768px) {
            .controls { bottom:80px; }
            .hud { bottom:10px; left:10px; padding:10px; }
            .minimap { bottom:10px; right:10px; width:100px; height:100px; }
            .chat-container { width:calc(100% - 40px); left:20px; bottom:160px; height:150px; }
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loading-screen">
        <div class="loading-logo">MetaVerse MMORPG</div>
        <div class="loading-bar-container">
            <div class="loading-bar" id="loading-bar"></div>
        </div>
        <div class="loading-text" id="loading-text">Caricamento risorse...</div>
    </div>

    <div id="game-container"></div>

    <div class="ui-overlay">
        <!-- Wallet status -->
        <div class="wallet-status ui-element">
            <div class="wallet-indicator"></div>
            <span class="wallet-address">0x71C...F8E2</span>
        </div>
        <!-- Crypto balance -->
        <div class="crypto-balance ui-element">
            <div class="token-icon"></div>
            <span>1,250 MVT</span>
        </div>
        <!-- Inventory button -->
        <div class="inventory-btn ui-element">
            <i class="fas fa-backpack"></i>
            <span>Inventario</span>
        </div>
        <!-- HUD -->
        <div class="hud ui-element">
            <div class="avatar">A</div>
            <div class="player-stats">
                <div class="player-name">Avventuriero</div>
                <div class="stats-bars">
                    <div class="stat-container">
                        <i class="fas fa-heart" style="color: #ff5e62;"></i>
                        <div class="stat-bar"><div class="stat-fill health-fill"></div></div>
                    </div>
                    <div class="stat-container">
                        <i class="fas fa-bolt" style="color: #56ccf2;"></i>
                        <div class="stat-bar"><div class="stat-fill energy-fill"></div></div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Minimap -->
        <div class="minimap ui-element">
            <div class="minimap-content">
                <div class="player-position"></div>
                <div class="landmark" style="top:30%; left:70%;"></div>
                <div class="landmark" style="top:65%; left:40%;"></div>
                <div class="landmark" style="top:20%; left:20%;"></div>
            </div>
        </div>
        <!-- Controls -->
        <div class="controls ui-element">
            <div class="control-btn" id="btn-inventory"><i class="fas fa-backpack"></i></div>
            <div class="control-btn" id="btn-attack"><i class="fas fa-sword"></i></div>
            <div class="control-btn" id="btn-interact"><i class="fas fa-hand-pointer"></i></div>
            <div class="control-btn" id="btn-emote"><i class="fas fa-smile"></i></div>
        </div>
        <!-- Chat -->
        <div class="chat-container ui-element">
            <div class="chat-messages" id="chat-messages">
                <div class="message"><span class="message-system">Benvenuto nel MetaVerse MMORPG!</span></div>
                <div class="message"><span class="message-user">Guida:</span> Usa i tasti WASD per muoverti</div>
                <div class="message"><span class="message-user">Giocatore1:</span> Ciao a tutti!</div>
                <div class="message"><span class="message-user">Cripto_Fan:</span> Hai visto i nuovi NFT?</div>
            </div>
            <div class="chat-input">
                <input type="text" placeholder="Scrivi un messaggio...">
            </div>
        </div>
        <!-- Notification -->
        <div class="notification" id="notification">NFT ricevuto: Amuleto di Potere</div>
    </div>

    <!-- Three.js e script di gioco -->
    <script type="module">
    import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.157.0/three.module.js';
    import { PointerLockControls } from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.157.0/examples/jsm/controls/PointerLockControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.157.0/examples/jsm/renderers/CSS2DRenderer.js';

    let scene, camera, renderer, labelRenderer, controls, clock;
    const otherPlayers = [], nftItems = [];

    initLoading();

    function initLoading() {
        const loadingBar = document.getElementById('loading-bar');
        const loadingText = document.getElementById('loading-text');
        const loadingScreen = document.getElementById('loading-screen');
        let progress = 0;
        const loadingInterval = setInterval(() => {
            progress += Math.random() * 10;
            if (progress >= 100) {
                progress = 100;
                clearInterval(loadingInterval);
                loadingText.textContent = "Caricamento completato!";
                setTimeout(() => {
                    loadingScreen.style.opacity = "0";
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        initGame();
                    }, 1000);
                }, 500);
            } else if (progress < 40) {
                loadingText.textContent = "Caricamento risorse...";
            } else if (progress < 70) {
                loadingText.textContent = "Connessione al MetaVerso...";
            } else {
                loadingText.textContent = "Inizializzazione mondo virtuale...";
            }
            loadingBar.style.width = `${progress}%`;
        }, 300);
    }

    function initGame() {
        // Scene, camera, renderer
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a36);
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('game-container').appendChild(renderer.domElement);

        // Label renderer per name tags
        labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        document.body.appendChild(labelRenderer.domElement);

        // Controlli first-person
        controls = new PointerLockControls(camera, renderer.domElement);
        document.body.addEventListener('click', () => controls.lock());
        scene.add(controls.getObject());

        // Luci
        scene.add(new THREE.AmbientLight(0x404040, 2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Terreno
        const groundGeo = new THREE.PlaneGeometry(100,100);
        groundGeo.rotateX(-Math.PI/2);
        scene.add(new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ color:0x2a2a46, roughness:0.8, metalness:0.2 })).receiveShadow = true);

        // InstancedMesh per edifici
        const bGeo = new THREE.BoxGeometry(2,1,2);
        const bMat = new THREE.MeshStandardMaterial({ roughness:0.7, metalness:0.3 });
        const instB = new THREE.InstancedMesh(bGeo, bMat, 20);
        instB.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        for (let i = 0; i < 20; i++) {
            const dummy = new THREE.Object3D();
            const h = Math.random()*3+1;
            dummy.scale.set(1,h,1);
            dummy.position.set(Math.random()*80-40, h/2, Math.random()*80-40);
            if (Math.abs(dummy.position.x)>5 || Math.abs(dummy.position.z)>5) {
                dummy.updateMatrix();
                instB.setMatrixAt(i, dummy.matrix);
                instB.setColorAt(i, new THREE.Color(Math.random()>0.5?0x6c63ff:0x38ffdd));
            }
        }
        scene.add(instB);

        // Giocatore
        const pGeo = new THREE.CapsuleGeometry(0.5,1,4,8);
        const pMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.3, metalness:0.7 });
        const player = new THREE.Mesh(pGeo, pMat);
        player.position.y = 1;
        player.castShadow = true;
        scene.add(player);

        // Altri giocatori con name tag
        for (let i = 0; i < 5; i++) {
            const mesh = new THREE.Mesh(pGeo, new THREE.MeshStandardMaterial({ color:0xff6584, roughness:0.3, metalness:0.7 }));
            mesh.position.set(Math.random()*20-10, 1, Math.random()*20-10);
            mesh.castShadow = true;
            scene.add(mesh);
            const div = document.createElement('div');
            div.className = 'label';
            div.textContent = `P${Math.floor(Math.random()*1000)}`;
            const label = new CSS2DObject(div);
            mesh.add(label);
            otherPlayers.push({ mesh, direction: new THREE.Vector3(Math.random()*0.02-0.01, 0, Math.random()*0.02-0.01) });
        }

        // NFT items
        const nftGeo = new THREE.OctahedronGeometry(0.3, 0);
        const nftMat = new THREE.MeshStandardMaterial({ color:0xffdd00, emissive:0xff9900, emissiveIntensity:0.3, roughness:0.2, metalness:0.8 });
        for (let i = 0; i < 8; i++) {
            const nft = new THREE.Mesh(nftGeo, nftMat);
            nft.position.set(Math.random()*40-20, 0.5, Math.random()*40-20);
            nft.castShadow = true;
            scene.add(nft);
            nftItems.push({ mesh: nft, collected: false, rotationSpeed: Math.random()*0.03+0.01, floatOffset: Math.random()*Math.PI*2 });
        }

        // Input
        const keys = { w:false, a:false, s:false, d:false, shift:false };
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // Loop di animazione
        clock = new THREE.Clock();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth,window.innerHeight);
            labelRenderer.setSize(window.innerWidth,window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Movimento player
            let vel = new THREE.Vector3();
            const acc = 0.005, dec = 0.95, max = 0.15;
            if (keys.w) vel.z -= acc;
            if (keys.s) vel.z += acc;
            if (keys.a) vel.x -= acc;
            if (keys.d) vel.x += acc;
            vel.multiplyScalar(dec);
            if (vel.length() > max) vel.setLength(max);
            controls.moveRight(-vel.x);
            controls.moveForward(-vel.z);

            // Roaming other players
            otherPlayers.forEach(op => op.mesh.position.add(op.direction));

            // Animazione e collisione NFT
            const pBox = new THREE.Box3().setFromObject(player);
            nftItems.forEach(item => {
                if (!item.collected) {
                    item.mesh.rotation.y += item.rotationSpeed;
                    item.mesh.position.y = 0.5 + Math.sin(clock.elapsedTime + item.floatOffset) * 0.2;
                    const box = new THREE.Box3().setFromObject(item.mesh);
                    if (pBox.intersectsBox(box)) {
                        item.collected = true;
                        scene.remove(item.mesh);
                        showNotification('NFT raccolto!');
                    }
                }
            });

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // Notifiche
        function showNotification(msg) {
            const n = document.getElementById('notification');
            n.textContent = msg;
            n.classList.add('show');
            setTimeout(() => n.classList.remove('show'), 3000);
        }
    </script>
    <!-- Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/js/all.min.js"></script>
</body>
</html>
